server:
  port: ${PORT:8081}

spring:
  application:
    name: cargorent-user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cargorent_users?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:cargorent}
    password: ${DB_PASSWORD:cargorent}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

cargorent:
  jwt:
    # Must be identical in the API gateway. At least 32 characters.
    secret: ${JWT_SECRET:cargorent-dev-secret-change-me-please-32chars-min}
    validity-hours: 24
  admin:
    email: ${ADMIN_EMAIL:admin@cargorent.com}
    password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
